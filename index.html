<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appstorm · CRM (espelho)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= tokens ================= */
:root{
  --bg:#e9e7e1; --frame:#f3f2ee; --surface:#fbfbf9; --card:#ffffff; --tile:#f2f1ec; --tile2:#ebe9e3;
  --line:#e6e4dd; --line2:#d9d6ce; --txt:#141416; --mut:#6c6c74; --dim:#a3a3aa;
  --ink:#111113; --ink-txt:#ffffff; --lime:#e4f45b; --lime-ink:#1a1f00; --yellow:#f2dd2e;
  --lilac:#dcd4f5; --pink:#f3cdef; --mint:#d4f0de; --sky:#d6e8f7; --peach:#fbdcc6;
  --slate:#a9b6c4; --dark-panel:#2a2a2c; --dark-row:#363638; --dark-txt:#f4f4f5; --dark-mut:#a1a1a8;
  --green:#16a865; --green-bg:#dff5e9; --red:#e5484d; --red-bg:#fde4e4; --amber:#c98a06; --amber-bg:#fdf1d3; --violet:#7b5cf0; --violet-bg:#ece7fd;
  --nexalab:#3b82f6; --gtg:#10b981; --tracktube:#f97316;
  --shadow:0 1px 2px rgba(20,20,22,.04),0 4px 14px rgba(20,20,22,.04);
  --shadow-lg:0 18px 50px rgba(20,20,22,.14);
  --r-xl:26px; --r-lg:20px; --r:14px; --r-sm:10px;
}
[data-tema="escuro"]{
  --bg:#202022; --frame:#0b0b0c; --surface:#0f0f10; --card:#18181a; --tile:#1f1f22; --tile2:#26262a;
  --line:#26262a; --line2:#323237; --txt:#f3f3f4; --mut:#9a9aa3; --dim:#66666f;
  --ink:#f3f3f4; --ink-txt:#0f0f10; --lilac:#2e2945; --pink:#3d2a3b; --yellow:#5a531c; --mint:#1d3328; --sky:#1d2a38; --peach:#3a2a1f;
  --slate:#2c333d; --dark-panel:#141416; --dark-row:#1d1d20;
  --green-bg:rgba(22,168,101,.16); --red-bg:rgba(229,72,77,.16); --amber-bg:rgba(201,138,6,.18); --violet-bg:rgba(123,92,240,.2);
  --shadow:none; --shadow-lg:0 18px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:500 14px/1.45 "Plus Jakarta Sans",Inter,"Segoe UI",system-ui,sans-serif;color:var(--txt);background:var(--bg);padding:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus,a:focus{outline:none} button:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--txt);background:var(--tile);border:1px solid transparent;border-radius:var(--r-sm);padding:9px 12px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{background:var(--card);border-color:var(--line2);box-shadow:0 0 0 4px rgba(20,20,22,.05)}
textarea{width:100%;resize:vertical;line-height:1.5;min-height:120px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.s{width:15px;height:15px}
::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid transparent;background-clip:padding-box}

/* ================= layout ================= */
.app{display:grid;grid-template-columns:268px 1fr;grid-template-rows:minmax(0,1fr);height:calc(100vh - 28px);background:var(--frame);border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line)}
aside{display:flex;flex-direction:column;padding:18px 14px 14px;gap:4px;overflow:auto}
.ws{display:flex;align-items:center;gap:11px;padding:6px 8px 14px}
.ws .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,#1b1b1f,#3a2f6b 55%,#e4f45b 140%);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(58,47,107,.35)}
.ws b{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800}
.ws b em{font-style:normal;font-size:10px;background:var(--ink);color:var(--ink-txt);padding:1px 6px;border-radius:6px}
.ws small{color:var(--mut);font-size:12px}
.search{display:flex;align-items:center;gap:9px;background:var(--tile);border-radius:12px;padding:9px 11px;color:var(--mut);margin:0 2px 14px}
.search input{background:none;border:0;padding:0;flex:1;min-width:0;box-shadow:none}
kbd{font:600 11px/1 inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--mut)}
.grp{font-size:12px;color:var(--mut);font-weight:600;padding:10px 10px 6px;display:flex;align-items:center;gap:6px}
.nv{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:var(--mut);font-weight:600;transition:.12s}
.nv:hover{color:var(--txt);background:var(--tile)}
.nv.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
[data-tema="escuro"] .nv.on{background:var(--tile2)}
.nv .ct{margin-left:auto;font-size:11px;font-weight:700;color:var(--mut)}
.nv .bd{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;min-width:20px;text-align:center}
.nv .pd{width:9px;height:9px;border-radius:3px;margin:0 4px}
.news{margin-top:auto;background:var(--card);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
[data-tema="escuro"] .news{background:var(--tile)}
.news h5{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
.news .st{display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 0 4px 4px;border-left:1px dashed var(--line2);margin-left:6px;padding-left:12px}
.news .st i{width:7px;height:7px;border-radius:50%;flex:none}
.user{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px;background:var(--card);margin-top:10px;box-shadow:var(--shadow)}
[data-tema="escuro"] .user{background:var(--tile)}
.user b{display:block;font-size:13.5px} .user small{color:var(--mut);font-size:12px}
.user .tg{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--tile);color:var(--mut)}
[data-tema="escuro"] .user .tg{background:var(--tile2)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 10px 10px 0}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px 14px 6px}
.crumb{color:var(--mut);font-size:13px;font-weight:600} .crumb b{color:var(--txt)}
.topbar .sp{flex:1}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--txt);position:relative;transition:.12s}
.ib:hover{border-color:var(--line2)}
.ib .dt{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:11px;font-weight:700;font-size:13.5px;white-space:nowrap;transition:.12s;border:1px solid var(--line);background:var(--card)}
.btn:hover{border-color:var(--line2)}
.btn.ink{background:var(--ink);color:var(--ink-txt);border-color:var(--ink)}
.btn.ink:hover{opacity:.88}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.ghost{background:var(--tile);border-color:transparent}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn.round{border-radius:999px}
.btn[disabled]{opacity:.4;pointer-events:none}
.stage{flex:1;background:var(--surface);border-radius:var(--r-xl);border:1px solid var(--line);overflow:auto;padding:30px 32px 90px;position:relative}
[data-tema="escuro"] .stage{background:var(--surface)}

/* ================= blocos ================= */
.h1{font-size:28px;font-weight:800;letter-spacing:-.6px}
.sub{color:var(--mut);margin-top:4px}
.eyebrow{font-size:12px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow)}
.row{display:flex;gap:16px} .grow{flex:1;min-width:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px} @media(max-width:1250px){.grid4{grid-template-columns:repeat(2,1fr)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media(max-width:1150px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} @media(max-width:1300px){.grid3{grid-template-columns:repeat(2,1fr)}} @media(max-width:900px){.grid3{grid-template-columns:1fr}}
.ttl{font-size:14px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:7px}
.big{font-size:30px;font-weight:800;letter-spacing:-.8px}
.delta{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700}
.delta i{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:9px}
.up{color:var(--green)} .up i{background:var(--green)} .dn{color:var(--red)} .dn i{background:var(--red)} .eq{color:var(--mut)} .eq i{background:var(--dim)}
.banner{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:14px;padding:8px 8px 8px 10px;margin:22px 0 18px}
.banner .ai{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#ff7a45,#ff3d9a 55%,#7b5cf0);display:grid;place-items:center;color:#fff}
.banner p{flex:1;color:var(--mut)} .banner p b{color:var(--txt)}
.stat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.stat .ic{width:40px;height:40px;border-radius:11px;background:var(--ink);color:var(--ink-txt);display:grid;place-items:center}
.stat .lk{font-size:13px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:3px}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.6px}
.stat .l{color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--tile);color:var(--mut);white-space:nowrap}
.flag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid}
.flag.h5{color:#c2185b;background:#fde4ef;border-color:#f8c4da} .flag.h4{color:var(--red);background:var(--red-bg);border-color:#f6c5c6}
.flag.h3{color:var(--amber);background:var(--amber-bg);border-color:#f2dca0} .flag.h2{color:var(--violet);background:var(--violet-bg);border-color:#d7ccfb} .flag.h1,.flag.h0{color:var(--green);background:var(--green-bg);border-color:#bfe9d1}
[data-tema="escuro"] .flag{border-color:transparent}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1b1b1f;flex:none}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:52px;height:52px;font-size:18px}
.proj{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut)}
.proj i{width:8px;height:8px;border-radius:3px}
.dash5{display:flex;gap:4px} .dash5 i{height:3px;width:22px;border-radius:3px;background:currentColor;opacity:.18} .dash5 i.on{opacity:1}
.empty{color:var(--dim);text-align:center;padding:36px 10px;font-weight:600}
.mut{color:var(--mut)} .small{font-size:12.5px}
.tabs-u{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs-u button{padding:10px 16px;font-weight:700;color:var(--mut);position:relative}
.tabs-u button.on{color:var(--txt)} .tabs-u button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--txt);border-radius:2px}
.segbar{display:flex;gap:6px;margin:18px 0 16px} .segbar i{height:7px;border-radius:9px;background:var(--tile2);min-width:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile i.b{display:block;width:26px;height:4px;border-radius:4px;margin-bottom:10px}
.tile .tl{font-size:13px;color:var(--mut);font-weight:600} .tile .tv{font-size:22px;font-weight:800;letter-spacing:-.4px} .tile .tv small{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:10px;height:10px;border-radius:3px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.list .it b{display:block;font-size:13.5px} .list .it small{color:var(--mut);font-size:12px}
.clk{cursor:pointer}

/* gráfico */
.chart{position:relative;height:280px;margin-top:16px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .gl{stroke:var(--line);stroke-dasharray:4 5}
.chart .yl,.chart .xl{fill:var(--mut);font-size:12px;font-weight:600}
.chart .tip{position:absolute;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);border-radius:12px;padding:9px 12px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap}
.chart .tip b{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.chart .tip span{display:flex;align-items:center;gap:7px;font-weight:700} .chart .tip span i{width:8px;height:8px;border-radius:50%}
.chart .datepill{position:absolute;bottom:-4px;transform:translateX(-50%);background:var(--ink);color:var(--ink-txt);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;opacity:0;pointer-events:none}

/* pipeline (ref 5) */
.pl-head{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.pl-head .stats{display:flex;gap:34px;margin-left:auto}
.pl-head .stats div span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.pl-head .stats div b{font-size:28px;font-weight:700;letter-spacing:-.5px}
.chipbar{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 8px 0 15px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--line2);background:var(--card)}
.chip.on{background:var(--ink);color:var(--ink-txt);border-color:var(--ink)}
.chip em{font-style:normal;min-width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-size:11px;background:var(--tile);color:var(--txt);padding:0 6px}
.chip.on em{background:var(--yellow);color:#1b1b1f}
.chip.ic{width:38px;padding:0;justify-content:center}
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:20px}
.col{min-width:262px;width:262px;flex:none;display:flex;flex-direction:column;border-radius:var(--r-lg);transition:.12s}
.col .hd{display:flex;align-items:center;gap:8px;padding:2px 2px 10px}
.col .hd .st{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 11px;border-radius:999px;font-weight:700;font-size:13px}
.col .hd .st em{font-style:normal;font-size:11px;background:var(--card);border-radius:999px;padding:1px 7px;color:var(--txt)}
.col .hd .mr{margin-left:auto;color:var(--mut);width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.col .ln{height:4px;border-radius:4px;margin-bottom:12px}
.col .bdy{display:flex;flex-direction:column;gap:10px;min-height:120px;padding-bottom:6px}
.col.drop .bdy{outline:2px dashed var(--line2);outline-offset:4px;border-radius:18px}
.kc{border-radius:20px;padding:15px 15px 14px;background:var(--card);border:1px solid var(--line);cursor:grab;position:relative;transition:transform .14s, box-shadow .14s}
.kc:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,20,22,.08)}
.kc.dragging{transform:rotate(3deg);box-shadow:var(--shadow-lg);opacity:.92}
.kc.c5{background:var(--yellow);border-color:transparent} .kc.c4{background:var(--pink);border-color:transparent} .kc.c3{background:var(--lilac);border-color:transparent}
.kc.c0,.kc.c1{background:var(--tile2);border-color:transparent}
.kc .t{font-size:13px;font-weight:700;line-height:1.3;padding-right:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .mo{position:absolute;top:11px;right:11px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55)}
[data-tema="escuro"] .kc .mo{background:rgba(255,255,255,.08)}
.kc .dash5{margin:12px 0 14px}
.kc .ft{display:flex;align-items:center;gap:10px;padding-right:66px}
.kc .ft>div{min-width:0} .kc .ft small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .ft b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px} .kc .ft small{font-size:11.5px;color:var(--mut);font-weight:600}
[data-tema="escuro"] .kc.c5 small,[data-tema="escuro"] .kc.c4 small,[data-tema="escuro"] .kc.c3 small{color:#cfcfd6}
.kc .ch{position:absolute;right:12px;bottom:14px;display:flex;gap:5px}
.kc .ch span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ink-txt)}
.kc .ch span.off{background:rgba(255,255,255,.5);color:var(--dim)}
[data-tema="escuro"] .kc .ch span.off{background:rgba(255,255,255,.07)}
.hatch{border-radius:20px;min-height:110px;background:repeating-linear-gradient(135deg,var(--tile) 0 8px,transparent 8px 16px);border:1px dashed var(--line2);display:grid;place-items:center;color:var(--dim);font-size:12.5px;font-weight:600}
.dock{position:sticky;bottom:6px;left:0;display:flex;justify-content:center;pointer-events:none;margin-top:-30px}
.dock div{pointer-events:auto;display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:6px;border-radius:999px;box-shadow:var(--shadow-lg)}
.dock button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--tile);color:var(--txt)}
.dock button.main{background:var(--ink);color:var(--ink-txt)}

/* leads (ref 4) */
.ftabs{display:flex;gap:0;align-items:flex-end;margin-bottom:-1px;position:relative;z-index:1}
.ftab{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:18px 18px 0 0;font-weight:600;color:var(--mut);background:var(--tile);margin-right:6px;border:1px solid var(--line);border-bottom:0}
.ftab .fi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--mut)}
.ftab em{font-style:normal;font-size:11.5px;font-weight:700;background:var(--card);border-radius:999px;padding:1px 8px;color:var(--txt)}
.ftab.on{background:var(--card);color:var(--txt)} .ftab.on .fi{background:var(--violet-bg);color:var(--violet)} .ftab.on em{background:var(--violet-bg);color:var(--violet)}
.fpanel{background:var(--card);border:1px solid var(--line);border-radius:0 var(--r-xl) var(--r-xl) var(--r-xl);padding:22px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;background:var(--tile);border-radius:12px;padding:4px;gap:2px}
.seg button{display:flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:9px;font-weight:600;color:var(--mut);font-size:13px}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
[data-tema="escuro"] .seg button.on{background:var(--tile2)}
.lc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:.14s;position:relative}
[data-tema="escuro"] .lc{background:var(--tile)}
.lc:hover{box-shadow:0 12px 30px rgba(20,20,22,.07)}
.lc.sel{outline:2px solid var(--ink);outline-offset:-1px}
.lc .hd{display:flex;align-items:center;gap:10px}
.lc .hd b{font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lc .pair div{background:var(--tile);border-radius:12px;padding:9px 11px;min-width:0}
[data-tema="escuro"] .lc .pair div{background:var(--tile2)}

const ESPELHO = !!window.__ESPELHO__;
async function lerEspelho(){
  const k = localStorage.getItem("crm_espelho_k");
  if(!k) throw new Error("Abra o link completo da equipe uma vez neste navegador (ele contém a chave).");
  const b = Uint8Array.from(atob(k.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0));
  const chave = await crypto.subtle.importKey("raw", b, "AES-GCM", false, ["decrypt"]);
  const buf = new Uint8Array(await (await fetch("data.enc?t="+Date.now(), {cache:"no-store"})).arrayBuffer());
  let txt;
  try { txt = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, chave, buf.slice(12)); }
  catch(e){ localStorage.removeItem("crm_espelho_k"); throw new Error("Chave inválida. Abra de novo o link completo da equipe."); }
  return JSON.parse(new TextDecoder().decode(txt));
}
async function api(url, body){
  if(ESPELHO){ if(url==="/api/estado") return lerEspelho(); throw new Error("Este é o espelho somente leitura. Use “Abrir CRM ao vivo” para editar."); }
  const r=await fetch(url,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json(); if(!r.ok||j.erro) throw new Error(j.erro||r.statusText); return j; }

let GD=null;
function grafico(){
  const ls=S.leads.filter(l=>doProj(l)), env=S.outbox.filter(o=>o.status==="enviado"&&doProj(leadDe(o.lead_id)||{}));
  const datas=ls.map(l=>dt(l.origem_criado)).filter(Boolean), primeira=datas.length?Math.min(...datas):Date.now();
  const porHora=(Date.now()-primeira)<3*864e5;
  let chaves, chave, rot;
  if(porHora){ const h=new Date(); h.setMinutes(0,0,0); chaves=[...Array(24)].map((_,i)=>new Date(h-(23-i)*36e5));
    chave=d=>{const x=new Date(d); x.setMinutes(0,0,0); return x.getTime();}; rot=d=>d.getHours()+"h"; }
  else { const h=new Date(); h.setHours(0,0,0,0); chaves=[...Array(21)].map((_,i)=>new Date(h-(20-i)*864e5));
    chave=d=>{const x=new Date(d); x.setHours(0,0,0,0); return x.getTime();}; rot=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".",""); }
  const a={}, b={}; ls.forEach(l=>{const d=dt(l.origem_criado); if(d){const k=chave(d); a[k]=(a[k]||0)+1;}});
  env.forEach(o=>{const d=dt(o.enviado_em); if(d){const k=chave(d); b[k]=(b[k]||0)+1;}});
  const sa=chaves.map(d=>a[d.getTime()]||0), sb=chaves.map(d=>b[d.getTime()]||0), n=sa.length, h2=Math.floor(n/2);
  const tot=sa.reduce((x,y)=>x+y,0), ant=sa.slice(0,h2).reduce((x,y)=>x+y,0), dep=sa.slice(h2).reduce((x,y)=>x+y,0);
  GD={chaves,sa,sb,rot,porHora};
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="ttl">Leads e envios ${porHora?"por hora · últimas 24 h":"por dia · últimos 21 dias"} ${ic("info","s")}</div><div class="big" style="margin-top:6px">${tot} <span class="mut" style="font-size:15px;font-weight:600">leads gerados pelos agentes</span></div></div>
    <div style="text-align:right">${deltaTag(dep,ant,porHora?"vs 12 h antes":"vs 10 dias antes")}<div class="legend" style="margin-top:10px;justify-content:flex-end"><span><i style="background:var(--txt)"></i>Leads gerados</span><span><i style="background:var(--violet)"></i>Envios</span></div></div></div>
    <div class="chart" id="chart"><svg id="csvg"></svg><div class="tip" id="ctip"></div><div class="datepill" id="cpill"></div></div>`;
}
function ligarGrafico(){
  const box=document.getElementById("chart"); if(!box||!GD) return;
  const W=box.clientWidth, H=box.clientHeight, pl=44, pr=12, pt=10, pb=34, iw=W-pl-pr, ih=H-pt-pb;
  const mx=Math.max(4,...GD.sa,...GD.sb), step=Math.ceil(mx/4), top=step*4, n=GD.sa.length;
  const X=i=>pl+i*iw/(n-1), Y=v=>pt+ih-v/top*ih;
  const curva=s=>s.map((v,i)=>{const x=X(i),y=Y(v); if(!i) return `M${x},${y}`; const px=X(i-1),py=Y(s[i-1]),cx=(px+x)/2; return `C${cx},${py} ${cx},${y} ${x},${y}`;}).join(" ");
  const forte=getComputedStyle(document.documentElement).getPropertyValue("--txt").trim();
  let g=`<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${forte}" stop-opacity=".22"/><stop offset="1" stop-color="${forte}" stop-opacity="0"/></linearGradient></defs>`;
  for(let k=0;k<=4;k++){const y=Y(step*k); g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="yl" x="${pl-12}" y="${y+4}" text-anchor="end">${step*k}</text>`;}
  GD.chaves.forEach((d,i)=>{ if(i%4===0||i===n-1) g+=`<text class="xl" x="${X(i)}" y="${H-8}" text-anchor="middle">${GD.rot(d)}</text>`; });
  g+=`<path d="${curva(GD.sa)} L${X(n-1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="url(#ga)"/><path d="${curva(GD.sa)}" fill="none" stroke="${forte}" stroke-width="2"/>`;
  g+=`<path d="${curva(GD.sb)}" fill="none" stroke="var(--violet)" stroke-width="2" stroke-dasharray="5 5"/>`;
  g+=`<line id="cl" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="${forte}" stroke-width="1.5" opacity="0"/><circle id="cd" r="5" fill="var(--card)" stroke="${forte}" stroke-width="2" opacity="0"/>`;
  const svg=document.getElementById("csvg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=g;
  const tip=document.getElementById("ctip"), pill=document.getElementById("cpill"), cl=svg.querySelector("#cl"), cd=svg.querySelector("#cd");
  box.onmousemove=e=>{const r=box.getBoundingClientRect(); const i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left-pl)/iw*(n-1)))); const x=X(i);
    cl.setAttribute("x1",x); cl.setAttribute("x2",x); cl.setAttribute("opacity",1); cd.setAttribute("cx",x); cd.setAttribute("cy",Y(GD.sa[i])); cd.setAttribute("opacity",1);
    const d=GD.chaves[i]; tip.innerHTML=`<b>${GD.porHora?d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit"})+", "+GD.rot(d):d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})}</b><span><i style="background:${forte}"></i>Leads&nbsp;&nbsp;${GD.sa[i]}</span><span><i style="background:var(--violet)"></i>Envios&nbsp;&nbsp;${GD.sb[i]}</span>`;
    tip.style.opacity=1; tip.style.left=Math.min(x+14,W-150)+"px"; tip.style.top=Math.max(0,Y(GD.sa[i])-60)+"px";
    pill.textContent=GD.rot(d); pill.style.left=x+"px"; pill.style.opacity=1;};
  box.onmouseleave=()=>{tip.style.opacity=0; pill.style.opacity=0; cl.setAttribute("opacity",0); cd.setAttribute("opacity",0);};
}

      <div class="card"><div class="ttl" style="margin-bottom:14px">${ic("zap","s")}WhatsApp</div><div class="form">
        <label class="full">Modo de envio<select id="c_whatsapp_modo"><option value="manual" ${c.whatsapp_modo!=="cloud_api"?"selected":""}>Manual · 1 clique por mensagem (recomendado)</option><option value="cloud_api" ${c.whatsapp_modo==="cloud_api"?"selected":""}>API oficial da Meta · 100% automático</option></select></label>
        <label>Token de acesso<input id="c_wa_token" type="password" value="${v("wa_token")}" autocomplete="new-password"></label>
        <label>Phone number ID<input id="c_wa_phone_id" value="${v("wa_phone_id")}"></label>
        <label>Template do 1º contato<input id="c_wa_template" value="${v("wa_template")}" placeholder="abordagem_appstorm"></label>
        <label>Idioma do template<input id="c_wa_template_lang" value="${v("wa_template_lang")}"></label>
        <label class="sw full"><input type="checkbox" id="c_wa_template_com_empresa" ${ck("wa_template_com_empresa")}>O template tem a variável {{1}} = nome da empresa</label>
        <label class="full">Testar envio<span style="display:flex;gap:8px"><input id="t_zap" placeholder="5512999999999" style="flex:1"><button class="btn" id="testzap">Testar</button></span></label></div>
        <div class="note warn" style="margin-top:12px">${ic("info","s")}<div>As <b>respostas</b> aos leads ficam com o agente <b>Atendente de Leads Appstorm</b> no OpenBot, no número conectado a ele. Pela API da Meta, o 1º contato precisa de template aprovado.</div></div></div>
      </div></div>
    <div style="display:flex;gap:10px;margin-top:18px"><button class="btn ink" id="salvarcfg">${ic("check","s")}Salvar configurações</button><button class="btn" id="sync3">${ic("refresh","s")}Sincronizar agora</button><a class="btn" href="/excel">${ic("download","s")}Exportar Excel</a></div></div>`;
}

/* ================= ficha do lead ================= */
function abrirLead(id){ if(!leadDe(id)) return; aberto=+id; abaLead="resumo"; desenharDrawer(); document.getElementById("drawer").classList.add("on"); document.getElementById("ovl").classList.add("on"); }
function fechar(){ aberto=null; editando=false; document.getElementById("drawer").classList.remove("on"); document.getElementById("ovl").classList.remove("on"); }
function desenharDrawer(){
  const l=leadDe(aberto); if(!l) return fechar();
  const ob=S.outbox.filter(o=>o.lead_id===l.id), atv=S.atividades.filter(a=>a.lead_id===l.id);
  const k=(t,v,full)=>v?`<div class="${full?"full":""}"><span>${t}</span><p>${v}</p></div>`:"";
  const zap=personal(l.msg_whatsapp), lk=wa(l.whatsapp,zap);
  let corpo="";
  if(abaLead==="resumo") corpo=`<div class="sec"><h6>Por que escolher</h6><div style="font-size:15px;font-weight:600;line-height:1.45">${esc(l.por_que||"—")}</div></div>
    <div class="sec kv">${k("Motivos para aceitar",esc(l.motivos_aceitar),1)}${k("Motivos para recusar",esc(l.motivos_recusar),1)}${k("Sinais",esc(l.sinais),1)}${k("Cargo-alvo",esc(l.cargo_alvo))}${k("Porte",esc(l.porte))}${k("Sistema atual",esc(l.software))}${k("Lote",esc(l.lote))}${k("Observações",esc(l.observacoes),1)}</div>
    <div class="sec"><h6>Contato</h6><div class="form"><label>WhatsApp<input id="d_whatsapp" value="${esc(l.whatsapp||"")}" placeholder="55 + DDD + número"></label><label>E-mail<input id="d_email" value="${esc(l.email||"")}"></label></div>
      <div class="kv" style="margin-top:10px">${k("Canais encontrados",esc(l.canal),1)}${k("Site",l.site?`<a href="${esc(/^https?:/.test(l.site)?l.site:"https://"+l.site)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(l.site)}</a>`:"")}${k("Fontes",linkify(l.fontes),1)}</div></div>`;
  if(abaLead==="mensagens") corpo=`<div class="sec"><h6>WhatsApp / LinkedIn</h6><textarea id="d_msg_whatsapp" style="min-height:160px">${esc(l.msg_whatsapp||"")}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${lk?`<a class="btn lime" href="${lk}" target="_blank" rel="noopener">${ic("zap","s")}Abrir no WhatsApp</a>`:'<span class="pill">sem WhatsApp</span>'}<button class="btn" data-fila="whatsapp">${ic("clock","s")}Pôr na fila</button></div></div>
    <div class="sec"><h6>E-mail</h6><input id="d_msg_assunto" value="${esc(l.msg_assunto||"")}" placeholder="Assunto" style="width:100%;margin-bottom:8px"><textarea id="d_msg_email" style="min-height:200px">${esc(l.msg_email||"")}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-fila="email" ${l.email?"":"disabled"}>${ic("clock","s")}Pôr na fila (e-mail)</button></div></div>
    <div class="note">${ic("info","s")}<div><b>{seu_nome}</b>, <b>[Nome]</b> e <b>[Assinatura]</b> são trocados automaticamente no envio.</div></div>`;
  if(abaLead==="historico") corpo=`<div class="sec"><h6>Adicionar nota</h6><div style="display:flex;gap:8px"><input id="d_nota" placeholder="ex.: ligou e pediu proposta para março" style="flex:1"><button class="btn ink" id="addnota">Adicionar</button></div></div>
    <div class="sec"><h6>Envios</h6>${ob.length?ob.map(o=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px" class="small"><span class="pill">${o.canal==="whatsapp"?"WhatsApp":"E-mail"}</span><b>${o.etapa==="D0"?"1º contato":"Follow-up "+o.etapa.replace("D","D+")}</b><span class="mut">${o.status} · ${quando(o.enviado_em||o.agendado_para)}</span></div>`).join(""):'<div class="mut small">Nenhum envio ainda.</div>'}</div>
    <div class="sec"><h6>Linha do tempo</h6><div class="tl">${atv.length?atv.map(a=>`<div>${esc(a.texto)}<small>${dataCurta(a.criado_em)} · ${quando(a.criado_em)}</small></div>`).join(""):'<div class="mut small">Sem atividade.</div>'}</div></div>`;
  document.getElementById("drawer").innerHTML=`<div class="dh"><div style="display:flex;align-items:center;gap:8px">${projTag(l.projeto)}<span class="mut small">· ${esc(l.segmento||"")}</span><button class="ib" id="fechar" style="margin-left:auto;width:34px;height:34px">${ic("x","s")}</button></div>
    <div style="display:flex;gap:14px;align-items:center;margin-top:12px">${av(l.empresa,"lg")}<div style="min-width:0"><div style="font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.2">${esc(l.empresa)}</div><div class="mut">${esc(l.cidade||"")}${l.uf?"/"+esc(l.uf):""}</div></div></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center">
      <select id="d_status">${ST.map(s=>`<option value="${s[0]}" ${l.status===s[0]?"selected":""}>${s[1]}</option>`).join("")}</select>
      <select id="d_calor">${[0,1,2,3,4,5].map(c=>`<option value="${c}" ${l.calor==c?"selected":""}>Calor ${c}/5</option>`).join("")}</select>
      <label class="sw small" style="padding:7px 10px"><input type="checkbox" id="d_optout" ${l.optout?"checked":""}>Não contatar</label>
      <button class="btn ink" id="salvarlead" style="margin-left:auto">Salvar</button></div>
    <div class="tabs-u" style="margin-top:16px">${[["resumo","Resumo"],["mensagens","Mensagens"],["historico","Histórico"]].map(([kk,n])=>`<button class="${abaLead===kk?"on":""}" data-tab="${kk}">${n}</button>`).join("")}</div></div>
    <div class="db">${corpo}</div>`;
}
async function salvarLead(silencioso){
  const g=id=>document.getElementById(id), d={status:g("d_status").value, calor:+g("d_calor").value, optout:g("d_optout").checked};
  if(g("d_msg_whatsapp")){ d.msg_whatsapp=g("d_msg_whatsapp").value; d.msg_email=g("d_msg_email").value; d.msg_assunto=g("d_msg_assunto").value; }
  if(g("d_whatsapp")){ d.whatsapp=g("d_whatsapp").value; d.email=g("d_email").value; }
  try{ await api(`/api/lead/${aberto}`,d); if(!silencioso) toast("Lead salvo","Alterações gravadas no CRM"); editando=false; await carregar(); }catch(e){ toast("Não foi possível salvar",e.message,true); }
}

/* ================= eventos ================= */
async function gerarPara(ids, canal){ try{ const r=await api("/api/envios/gerar",{lead_ids:ids,canal}); if(r.criados){ toast(`${r.criados} envio${r.criados>1?"s":""} criado${r.criados>1?"s":""}`, r.pulados?`${r.pulados} sem contato, já na fila ou encerrados`:"Revise e aprove na tela Envios"); } else toast("Nenhum envio criado","Sem contato, já na fila ou lead encerrado",true); return r; }catch(e){ toast("Erro",e.message,true); } }
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-p],[data-lead],[data-aba],[data-ac],[data-tab],[data-fila],[data-gest],[data-tabl],[data-vista],[data-ck],[data-abordar],[data-env],button[id],a[id]");
  if(!t) return;
  const id=t.id;
  if(t.dataset.p!==undefined){ projeto=t.dataset.p; localStorage.setItem("crm_proj",projeto); return render(); }
  if(id==="tema"){ tema=tema==="claro"?"escuro":"claro"; localStorage.setItem("crm_tema",tema); document.documentElement.dataset.tema=tema; return render(); }
  if(id==="fechar") return fechar();
  if(["novoenvio","novoenvio2","novoenvio3"].includes(id)){ abaLeads="prontos"; location.hash="#/leads"; rota="leads"; return render(); }
  if(["sync","sync2","sync3"].includes(id)){ const r=await api("/api/sincronizar",{}); toast("Sincronizado",`${r.novos||0} novos · ${r.atualizados||0} atualizados`); return carregar(); }
  if(t.dataset.gest){ abaGest=t.dataset.gest; return render(); }
  if(t.dataset.tabl){ abaLeads=t.dataset.tabl; return render(); }
  if(t.dataset.vista){ vistaLeads=t.dataset.vista; localStorage.setItem("crm_vista",vistaLeads); return render(); }
  if(t.dataset.ck){ e.stopPropagation(); const n=+t.dataset.ck; sel.has(n)?sel.delete(n):sel.add(n); return render(); }
  if(t.dataset.abordar){ await gerarPara([+t.dataset.abordar],"auto"); return carregar(); }
  if(t.dataset.env){ selEnv=+t.dataset.env; editando=false; return render(); }
  if(t.dataset.tab){ await salvarLead(true); abaLead=t.dataset.tab; return desenharDrawer(); }
  if(id==="salvarlead") return salvarLead();
  if(id==="addnota"){ const n=document.getElementById("d_nota").value.trim(); if(!n) return; await api(`/api/lead/${aberto}`,{nota:n}); toast("Nota adicionada"); return carregar(); }
  if(t.dataset.fila){ await salvarLead(true); await gerarPara([aberto],t.dataset.fila); return carregar(); }
  if(t.dataset.lead && !e.target.closest("[data-ck],[data-abordar]")) return abrirLead(t.dataset.lead);
  if(t.dataset.aba){ abaEnv=t.dataset.aba; selEnv=null; return render(); }
  if(id==="selq"){ L().filter(l=>(l.calor||0)>=4&&l.status==="rascunho_pronto"&&!l.optout&&(l.whatsapp||l.email)).forEach(l=>sel.add(l.id)); toast(`${sel.size} leads selecionados`,"Clique em Gerar envios"); return render(); }
  if(id==="limpasel"){ sel.clear(); return render(); }
  if(id==="gerar"){ const r=await gerarPara([...sel],"auto"); if(r&&r.criados){ sel.clear(); abaEnv="rascunho"; location.hash="#/envios"; } return carregar(); }
  if(id==="aprtodos"){ const r=await api("/api/outbox/aprovar_todos",{}); toast(`${r.aprovados} envios aprovados`,"Foram para a fila"); return carregar(); }
  if(id==="toggleauto"){ await api("/api/config",{automacao_ativa:!S.config.automacao_ativa}); toast(S.config.automacao_ativa?"Automação desligada":"Automação ligada", S.config.automacao_ativa?"Nada sai sozinho":"A fila aprovada será enviada no horário configurado"); return carregar(); }
  if(t.dataset.ac){ const oid=t.dataset.id; try{
      const tx=document.getElementById("envtexto"), as=document.getElementById("envassunto");
      if(tx&&!tx.disabled&&["salvar","aprovar","enviar_agora"].includes(t.dataset.ac)) await api(`/api/outbox/${oid}`,{acao:"editar",corpo:tx.value,...(as?{assunto:as.value}:{})});
      if(t.dataset.ac!=="salvar") await api(`/api/outbox/${oid}`,{acao:t.dataset.ac});
      const m={salvar:["Texto salvo",""],aprovar:["Envio aprovado","Foi para a fila"],cancelar:["Envio cancelado",""],marcar_enviado:["Marcado como enviado","Follow-ups agendados"],enviar_agora:["Enviado!",""]}[t.dataset.ac];
      toast(m[0],m[1]); editando=false; await carregar(); }catch(er){ toast("Não foi possível",er.message,true); } return; }
  if(id==="salvarcfg"){ const d={}; document.querySelectorAll("[id^=c_]").forEach(i=>d[i.id.slice(2)]=i.type==="checkbox"?i.checked:i.value); try{ await api("/api/config",d); toast("Configurações salvas"); editando=false; await carregar(); }catch(er){ toast("Erro",er.message,true); } return; }
  if(id==="testmail"){ try{ await api("/api/teste/email",{destino:document.getElementById("t_email").value}); toast("E-mail de teste enviado","Confira a caixa de entrada"); }catch(er){ toast("Falhou",er.message,true); } return; }
  if(id==="testzap"){ try{ await api("/api/teste/whatsapp",{numero:document.getElementById("t_zap").value,template:!!S.config.wa_template}); toast("WhatsApp de teste enviado"); }catch(er){ toast("Falhou",er.message,true); } return; }
  if(id==="ini"){ iniciais=!iniciais; return render(); }
});
document.addEventListener("change", e=>{
  const id=e.target.id;
  if(["fcal","fcanal"].includes(id)){ localStorage.setItem("crm_f",JSON.stringify({cal:+document.getElementById("fcal").value,canal:document.getElementById("fcanal").value})); return render(); }
  if(id==="fcanalE"){ localStorage.setItem("crm_fc",e.target.value); return render(); }
  if(id==="fetapa"){ localStorage.setItem("crm_fe",e.target.value); return render(); }
});
document.addEventListener("input", e=>{ if(e.target.id==="busca"){ busca=e.target.value.toLowerCase(); const pos=e.target.selectionStart; render(); const b=document.getElementById("busca"); b.focus(); b.setSelectionRange(pos,pos); } });
document.addEventListener("focusin", e=>{ if(e.target.matches("#view textarea,#view input:not([type=checkbox]),#view select")) editando=true; });
document.addEventListener("focusout", e=>{ setTimeout(()=>{ if(!document.activeElement?.matches("#view textarea,#view input:not([type=checkbox]),#view select")) editando=false; },300); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") fechar(); if(e.key==="/"&&!e.target.matches("input,textarea")){ e.preventDefault(); document.getElementById("busca").focus(); } });
document.addEventListener("dragstart", e=>{ const k=e.target.closest(".kc"); if(k){ e.dataTransfer.setData("text/plain",k.dataset.lead); k.classList.add("dragging"); } });
document.addEventListener("dragend", e=>{ e.target.closest?.(".kc")?.classList.remove("dragging"); });
document.addEventListener("dragover", e=>{ const c=e.target.closest(".col"); if(c){ e.preventDefault(); document.querySelectorAll(".col.drop").forEach(x=>x!==c&&x.classList.remove("drop")); c.classList.add("drop"); } });
document.addEventListener("drop", async e=>{ const c=e.target.closest(".col"); document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop")); if(!c) return; e.preventDefault();
  const lid=e.dataTransfer.getData("text/plain"); const l=leadDe(lid); if(!l||l.status===c.dataset.st) return;
  try{ await api(`/api/lead/${lid}`,{status:c.dataset.st}); toast("Lead movido",`${l.empresa} → ${STN[c.dataset.st]}`); await carregar(); }catch(er){ toast("Erro",er.message,true); } });
document.getElementById("ovl").addEventListener("click", fechar);
window.addEventListener("hashchange", ()=>{ rota=location.hash.slice(2)||"dash"; editando=false; render(); document.getElementById("stage").scrollTop=0; });
window.addEventListener("resize", ()=>{ if(rota==="dash") ligarGrafico(); });
carregar();
setInterval(()=>{ if(!editando && !aberto && !document.querySelector(".kc.dragging")) carregar(); }, ESPELHO?60000:20000);
</script>
</body>
</html>
